<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Jeu de blackjack interactif réalisé avec Rive." />
  <title>Blackjack</title>

  <style>
    :root {
      color-scheme: dark;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #071b17;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, #153f33 0%, transparent 58%),
        #071b17;
    }

    .game-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    #blackjack-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    .status-layer {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding:
        max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      color: #f4f7f6;
      text-align: center;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .status-layer.is-hidden {
      opacity: 0;
    }

    .status-card {
      width: min(100%, 560px);
      padding: clamp(12px, 3vw, 18px);
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 12px;
      background: rgb(4 18 15 / 78%);
      box-shadow: 0 12px 40px rgb(0 0 0 / 28%);
      backdrop-filter: blur(8px);
    }

    .status-card p {
      margin: 0;
      font-size: clamp(16px, 4vw, 22px);
    }

    .status-card small {
      display: block;
      max-width: 560px;
      margin-top: 8px;
      color: #c5d2ce;
      font-size: clamp(12px, 3vw, 14px);
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <main class="game-shell" aria-label="Jeu de blackjack">
    <canvas id="blackjack-canvas" width="1440" height="900" tabindex="0"
      aria-label="Table de blackjack interactive"></canvas>

    <div id="status-layer" class="status-layer" role="status" aria-live="polite">
      <div class="status-card">
        <p id="status-title">Chargement du blackjack…</p>
        <small id="status-detail">Initialisation de Rive et des scripts du jeu.</small>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/@rive-app/webgl2@2"></script>
  <script>
    (() => {
      "use strict";

      const RIVE_FILE = "./assets/blackjack.riv?v=7";
      const ARTBOARD = "kk";
      const STATE_MACHINE = "State Machine 1";

      const canvas = document.getElementById("blackjack-canvas");
      const statusLayer = document.getElementById("status-layer");
      const statusTitle = document.getElementById("status-title");
      const statusDetail = document.getElementById("status-detail");

      const getLayoutScaleFactor = () => {
        // Le plus petit côté détecte correctement un mobile en portrait
        // comme en paysage.
        const shortestSide = Math.min(canvas.clientWidth, canvas.clientHeight);

        if (shortestSide <= 480) {
          return 0.5;
        }

        if (shortestSide <= 768) {
          return 0.75;
        }

        return 1;
      };

      let game = null;
      let resizeFrame = 0;
      let currentLayoutScale = getLayoutScaleFactor();

      const showError = (message) => {
        statusTitle.textContent = "Impossible de charger le jeu";
        statusDetail.textContent = message;
        statusLayer.classList.remove("is-hidden");
      };

      const resizeRive = () => {
        cancelAnimationFrame(resizeFrame);

        resizeFrame = requestAnimationFrame(() => {
          if (!game) {
            return;
          }

          const nextScale = getLayoutScaleFactor();

          if (nextScale !== currentLayoutScale) {
            currentLayoutScale = nextScale;
            game.layout = new rive.Layout({
              fit: rive.Fit.Layout,
              layoutScaleFactor: nextScale,
            });
          }

          game.resizeDrawingSurfaceToCanvas();
        });
      };

      if (!window.rive) {
        showError("Le runtime Rive WebGL2 n'a pas pu être téléchargé.");
        return;
      }

      try {
        game = new rive.Rive({
          src: RIVE_FILE,
          canvas,
          artboard: ARTBOARD,
          stateMachines: STATE_MACHINE,
          autoplay: true,
          autoBind: true,
          layout: new rive.Layout({
            fit: rive.Fit.Layout,
            layoutScaleFactor: currentLayoutScale,
          }),
          onLoad: () => {
            resizeRive();
            statusLayer.classList.add("is-hidden");
            canvas.focus({ preventScroll: true });
          },
          onLoadError: (error) => {
            console.error("Erreur de chargement Rive :", error);
            showError(
              `Vérifie ${RIVE_FILE}, l'Artboard ${ARTBOARD} et la State Machine ${STATE_MACHINE}.`,
            );
          },
        });

        window.addEventListener("resize", resizeRive, { passive: true });

        if ("ResizeObserver" in window) {
          const observer = new ResizeObserver(resizeRive);
          observer.observe(canvas);

          window.addEventListener(
            "beforeunload",
            () => observer.disconnect(),
            { once: true },
          );
        }

        window.addEventListener(
          "beforeunload",
          () => {
            cancelAnimationFrame(resizeFrame);
            game?.cleanup();
            game = null;
          },
          { once: true },
        );
      } catch (error) {
        console.error("Erreur d'initialisation Rive :", error);
        showError("Le runtime Rive n'a pas pu initialiser le canvas WebGL2.");
      }
    })();
  </script>
</body>

</html>
